global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend kafka_frontend
    bind *:9093
    default_backend kafka_backend

backend kafka_backend
    balance roundrobin
    server kafka1 host.docker.internal:9092 check
    # server kafka2 broker2:9092 check
    # server kafka3 broker3:9092 check
